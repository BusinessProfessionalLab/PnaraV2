# Sveltia CMS configuration.
#
# Local editing: run `npx astro dev`, open http://localhost:4321/admin/ and
# choose "Work with Local Repository" — no backend needed.
# Production editing: replace OWNER/REPO below with your fork and register a
# GitHub OAuth app per https://sveltiacms.app/en/docs/auth/github
backend:
  name: github
  repo: OWNER/REPO
  branch: main

media_folder: public/assets
public_folder: /assets

collections:
  - name: blog
    label: Blog posts
    folder: src/content/blog
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - name: category
        label: Category
        widget: select
        options: [Engineering, Agent Design, AI & Industry, Use Cases, Product Updates]
      - { name: excerpt, label: Excerpt, widget: text }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: author, label: Author, widget: string }
      - { name: authorRole, label: Author role, widget: string }
      - { name: authorOrg, label: Author org, widget: string, default: Parley }
      - { name: avatar, label: Author avatar, widget: image }
      - { name: cover, label: Cover image, widget: image }
      - { name: ogImage, label: Social card image (JPG or PNG), widget: image, required: false }
      - { name: body, label: Body, widget: markdown }
